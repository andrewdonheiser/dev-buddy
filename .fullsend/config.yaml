# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
tracker:
    github:
        allowed_targets:
            repos:
                - fullsend-ai/fullsend
                - fullsend-ai/agents
runtime: pi
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
inference:
    gateway:
        url: https://api.enmaas.devshift.net
        auth: api-key
        models:
            rits/zai-org/glm-5-3:
                api: openai-completions
agents:
    - name: triage
      model: gateway/rits/zai-org/glm-5-3
      effort: high
      subagents:
        default: gateway/rits/zai-org/glm-5-3
    - name: code
      model: gateway/rits/zai-org/glm-5-3
      effort: high
      subagents:
        default: gateway/rits/zai-org/glm-5-3
    - name: review
      model: gateway/rits/zai-org/glm-5-3
      effort: high
      subagents:
        default: gateway/rits/zai-org/glm-5-3
    - name: fix
      model: gateway/rits/zai-org/glm-5-3
      effort: high
    - name: retro
      model: gateway/rits/zai-org/glm-5-3
      effort: high
    - name: prioritize
      model: gateway/rits/zai-org/glm-5-3
      effort: high
